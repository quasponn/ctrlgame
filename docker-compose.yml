services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CORS_ORIGIN: http://localhost:3001,http://localhost:5173
      PORT: "3001"
      DB_PATH: /data/db.sqlite
      SEED_FAST: "0"
    volumes:
      # Ваша локальная БД с аккаунтами и играми (файл должен существовать до docker compose up)
      - ./backend/db.sqlite:/data/db.sqlite
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/games/catalog?page=1&limit=1').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
