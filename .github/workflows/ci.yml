# CI — проверка кода при каждом push и Pull Request
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  JWT_SECRET: ci-test-secret-do-not-use-in-production
  SEED_FAST: "1"

jobs:
  backend-test:
    name: Backend — тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Подготовка тестовой БД (seed)
        run: node seed.js

      - name: Запуск тестов
        run: npm test

  frontend-build:
    name: Frontend — сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка production
        run: npm run build

  frontend-lint:
    name: Frontend — ESLint (информативно)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  docker-build:
    name: Docker — сборка образа
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сборка Docker-образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ctrlgame:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
